services:
  app:
    restart: unless-stopped
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?}
      KAZI_API_KEY: ${KAZI_API_KEY:?}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-production}
      OTEL_SAMPLING_PROBABILITY: ${OTEL_SAMPLING_PROBABILITY:-0.1}

  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
    ports: !reset []

  kafka:
    restart: unless-stopped
    ports: !reset []
