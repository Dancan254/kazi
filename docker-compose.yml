services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-kazi}
      DB_USER: ${DB_USER:-kazi}
      DB_PASSWORD: ${DB_PASSWORD:-kazi}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      ADZUNA_COUNTRY: ${ADZUNA_COUNTRY:-us}
      ADZUNA_CURRENCY: ${ADZUNA_CURRENCY:-USD}
      INGESTION_SCHEDULING_ENABLED: ${INGESTION_SCHEDULING_ENABLED:-false}
      INGESTION_INITIAL_DELAY: ${INGESTION_INITIAL_DELAY:-PT0S}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: ${DB_NAME:-kazi}
      POSTGRES_USER: ${DB_USER:-kazi}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kazi}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
