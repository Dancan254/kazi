services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-kazi}
      DB_USER: ${DB_USER:-kazi}
      DB_PASSWORD: ${DB_PASSWORD:-kazi}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      ADZUNA_COUNTRY: ${ADZUNA_COUNTRY:-us}
      ADZUNA_CURRENCY: ${ADZUNA_CURRENCY:-USD}
      GREENHOUSE_BASE_URL: ${GREENHOUSE_BASE_URL:-https://boards-api.greenhouse.io/v1/boards}
      GREENHOUSE_BOARDS_0_COMPANY: ${GREENHOUSE_BOARDS_0_COMPANY:-}
      GREENHOUSE_BOARDS_0_TOKEN: ${GREENHOUSE_BOARDS_0_TOKEN:-}
      GREENHOUSE_POLL_INTERVAL: ${GREENHOUSE_POLL_INTERVAL:-PT6H}
      LEVER_BASE_URL: ${LEVER_BASE_URL:-https://api.lever.co/v0/postings}
      LEVER_SITES_0_COMPANY: ${LEVER_SITES_0_COMPANY:-}
      LEVER_SITES_0_SITE: ${LEVER_SITES_0_SITE:-}
      LEVER_POLL_INTERVAL: ${LEVER_POLL_INTERVAL:-PT6H}
      ASHBY_BASE_URL: ${ASHBY_BASE_URL:-https://api.ashbyhq.com/posting-api/job-board}
      ASHBY_ORGANIZATIONS_0_COMPANY: ${ASHBY_ORGANIZATIONS_0_COMPANY:-}
      ASHBY_ORGANIZATIONS_0_BOARD: ${ASHBY_ORGANIZATIONS_0_BOARD:-}
      ASHBY_POLL_INTERVAL: ${ASHBY_POLL_INTERVAL:-PT6H}
      WORKDAY_SITES_0_COMPANY: ${WORKDAY_SITES_0_COMPANY:-}
      WORKDAY_SITES_0_BASE_URL: ${WORKDAY_SITES_0_BASE_URL:-}
      WORKDAY_SITES_0_TENANT: ${WORKDAY_SITES_0_TENANT:-}
      WORKDAY_SITES_0_SITE: ${WORKDAY_SITES_0_SITE:-}
      WORKDAY_POLL_INTERVAL: ${WORKDAY_POLL_INTERVAL:-PT6H}
      SMARTRECRUITERS_BASE_URL: ${SMARTRECRUITERS_BASE_URL:-https://api.smartrecruiters.com/v1/companies}
      SMARTRECRUITERS_COMPANIES_0_COMPANY: ${SMARTRECRUITERS_COMPANIES_0_COMPANY:-}
      SMARTRECRUITERS_COMPANIES_0_IDENTIFIER: ${SMARTRECRUITERS_COMPANIES_0_IDENTIFIER:-}
      SMARTRECRUITERS_POLL_INTERVAL: ${SMARTRECRUITERS_POLL_INTERVAL:-PT6H}
      INGESTION_SCHEDULING_ENABLED: ${INGESTION_SCHEDULING_ENABLED:-false}
      INGESTION_INITIAL_DELAY: ${INGESTION_INITIAL_DELAY:-PT0S}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: ${DB_NAME:-kazi}
      POSTGRES_USER: ${DB_USER:-kazi}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kazi}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.4.0
    ports:
      - "9092:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
