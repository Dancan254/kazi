spring:
  ai:
    mcp:
      server:
        name: ${MCP_SERVER_NAME:kazi}
        version: ${MCP_SERVER_VERSION:0.1.0}
        instructions: >
          Search the canonical Kazi job catalog. Use search_active_jobs when looking for
          current jobs to recommend; results contain active jobs only, newest first. Use
          get_job_details with a returned job UUID before giving the user an application link.
        protocol: streamable
  application:
    name: kazi
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/kazi}
    username: ${DB_USER:kazi}
    password: ${DB_PASSWORD:kazi}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:kazi}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: com.kazi.kazi.job
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

ingestion:
  scheduling-enabled: ${INGESTION_SCHEDULING_ENABLED:false}
  initial-delay: ${INGESTION_INITIAL_DELAY:PT0S}
  scheduler-pool-size: 2

adzuna:
  base-url: ${ADZUNA_BASE_URL:https://api.adzuna.com/v1/api}
  app-id: ${ADZUNA_APP_ID:}
  app-key: ${ADZUNA_APP_KEY:}
  country: ${ADZUNA_COUNTRY:us}
  currency: ${ADZUNA_CURRENCY:USD}
  results-per-page: 50
  retry:
    max-retries: 2
    delay-ms: 2000
    jitter-ms: 500
    multiplier: 2
    max-delay-ms: 30000

greenhouse:
  base-url: ${GREENHOUSE_BASE_URL:https://boards-api.greenhouse.io/v1/boards}
  poll-interval: ${GREENHOUSE_POLL_INTERVAL:PT6H}
  retry:
    max-retries: 2
    delay-ms: 2000
    jitter-ms: 500
    multiplier: 2
    max-delay-ms: 30000

lever:
  base-url: ${LEVER_BASE_URL:https://api.lever.co/v0/postings}
  page-size: 100
  poll-interval: ${LEVER_POLL_INTERVAL:PT6H}
  retry:
    max-retries: 2
    delay-ms: 2000
    jitter-ms: 500
    multiplier: 2
    max-delay-ms: 30000

ashby:
  base-url: ${ASHBY_BASE_URL:https://api.ashbyhq.com/posting-api/job-board}
  poll-interval: ${ASHBY_POLL_INTERVAL:PT6H}
  retry:
    max-retries: 2
    delay-ms: 2000
    jitter-ms: 500
    multiplier: 2
    max-delay-ms: 30000

workday:
  poll-interval: ${WORKDAY_POLL_INTERVAL:PT6H}
  retry:
    max-retries: 2
    delay-ms: 2000
    jitter-ms: 500
    multiplier: 2
    max-delay-ms: 30000

resilience4j:
  circuitbreaker:
    instances:
      adzuna:
        sliding-window-size: 10
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
      greenhouse:
        sliding-window-size: 10
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
      lever:
        sliding-window-size: 10
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
      ashby:
        sliding-window-size: 10
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
      workday:
        sliding-window-size: 10
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
